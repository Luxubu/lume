# The whole test suite, on Linux, macOS and Windows, for every push and
# pull request: what `tests/run.sh` checks on a developer's machine.
name: test

on:
  push:
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # the suite is bash scripts; on Windows, Git's bash, with its `sort`,
    # `sh` and the rest ahead of Windows' own on the PATH
    defaults:
      run:
        shell: bash
    env:
      # the order `sort` and `ls` put text in, as the expected files have it
      LC_ALL: C
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # the compiler's build, and the cache of crates every Lume program
      # built with cargo shares (`~/.cache/lume`)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            ~/.cache/lume
          key: ${{ runner.os }}-lume-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lume-

      # a path such as `/tmp/x` in the examples is `\tmp\x` on the current
      # drive to a Windows program; Windows has no such folder of its own.
      # Made, and made the temporary folder, so that Git's `sh` — whose
      # `/tmp` is the temporary folder — and Lume mean the same place
      - name: A /tmp for Windows programs
        if: runner.os == 'Windows'
        run: |
          d="/$(pwd | cut -d/ -f2)/tmp"
          mkdir -p "$d"
          echo "TEMP=$(cygpath -w "$d")" >> "$GITHUB_ENV"
          echo "TMP=$(cygpath -w "$d")" >> "$GITHUB_ENV"

      - name: Build the compiler
        run: cargo build --release --manifest-path compiler/Cargo.toml

      - name: Test suite
        run: tests/run.sh

      # TEMPORARY (milestone 106): the language server on Windows, by hand
      - name: LSP by hand
        if: always() && runner.os == 'Windows'
        run: |
          L="$(pwd -W)/compiler/target/release/lume.exe"
          d="$(cygpath -m /tmp)/lsphand"; mkdir -p "$d/one"; printf 'def main:\n  puts 1\n' > "$d/one/hello.lume"
          u="file:///$d/one/hello.lume"
          msg() { printf 'Content-Length: %d\r\n\r\n%s' "${#1}" "$1"; }
          {
            msg '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"processId":null,"rootUri":"file:///'"$d"'","capabilities":{}}}'
            msg '{"jsonrpc":"2.0","method":"initialized","params":{}}'
            msg '{"jsonrpc":"2.0","method":"textDocument/didOpen","params":{"textDocument":{"uri":"'"$u"'","languageId":"lume","version":1,"text":"def main:\n  puts nope + 1\n"}}}'
            sleep 5
            msg '{"jsonrpc":"2.0","method":"textDocument/didChange","params":{"textDocument":{"uri":"'"$u"'","version":2},"contentChanges":[{"text":"def main:\n  puts 1 + 1\n"}]}}'
            sleep 10
          } | (cd "$d" && "$L" lsp > "$d/out.txt" 2> "$d/err.txt"; echo "exit: $?")
          echo "--- stdout"; cat "$d/out.txt" | cut -c1-300; echo; echo "--- stderr"; cat "$d/err.txt"
