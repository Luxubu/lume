# The whole test suite, on Linux, macOS and Windows, for every push and
# pull request: what `tests/run.sh` checks on a developer's machine.
name: test

on:
  push:
  pull_request:

jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # the suite is bash scripts; on Windows, Git's bash, with its `sort`,
    # `sh` and the rest ahead of Windows' own on the PATH
    defaults:
      run:
        shell: bash
    env:
      # the order `sort` and `ls` put text in, as the expected files have it
      LC_ALL: C
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # the compiler's build, and the cache of crates every Lume program
      # built with cargo shares (`~/.cache/lume`)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/target
            ~/.cache/lume
          key: ${{ runner.os }}-lume-${{ hashFiles('compiler/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-lume-

      # a path such as `/tmp/x` in the examples is `\tmp\x` on the current
      # drive to a Windows program; Windows has no such folder of its own.
      # Made, and made the temporary folder, so that Git's `sh` — whose
      # `/tmp` is the temporary folder — and Lume mean the same place
      - name: A /tmp for Windows programs
        if: runner.os == 'Windows'
        run: |
          d="/$(pwd | cut -d/ -f2)/tmp"
          mkdir -p "$d"
          echo "TEMP=$(cygpath -w "$d")" >> "$GITHUB_ENV"
          echo "TMP=$(cygpath -w "$d")" >> "$GITHUB_ENV"

      - name: Build the compiler
        run: cargo build --release --manifest-path compiler/Cargo.toml

      - name: Test suite
        run: tests/run.sh

      # TEMPORARY (milestone 113): the language-server test on Windows, with the server's log
      - name: LSP test with the server's log
        if: always() && runner.os == 'Windows'
        run: |
          export LUME_UNIX_BIN="$(cygpath -m /usr/bin)" LUME_ROOT="$(pwd -W)" TMPDIR="$(cygpath -m "${TMPDIR:-/tmp}")"
          export LUME_LSP_LOG="$(cygpath -m /tmp)/lsp.log"
          timeout 120 compiler/target/lumecheck lsp "$(pwd -W)/compiler/target/release/lume.exe" 2>&1 | head -30 | cut -c1-200 || true
          sleep 3; echo "--- the server's log"; cat "$(cygpath -m /tmp)/lsp.log" | cut -c1-400 || true
